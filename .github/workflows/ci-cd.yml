name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  docker-image-api:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      ecr-password: ${{ steps.ecr-password.outputs.password }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/brewlite2:$IMAGE_TAG ./apps/api
          docker push $ECR_REGISTRY/brewlite2:$IMAGE_TAG
          docker tag $ECR_REGISTRY/brewlite2:$IMAGE_TAG $ECR_REGISTRY/brewlite2:latest
          docker push $ECR_REGISTRY/brewlite2:latest
      - name: Get ECR login password
        id: ecr-password
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'ap-southeast-2' }})" >> $GITHUB_OUTPUT


  deploy:
    needs: docker-image-api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API to EC2 over SSH
        uses: appleboy/ssh-action@v1
        env:
          ECR_PASSWORD: ${{ needs.docker-image-api.outputs.ecr-password }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,ECR_REGISTRY,IMAGE_TAG
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/brewlite2:$IMAGE_TAG"
            docker stop brewlite-api || true
            docker rm brewlite-api || true
            docker run -d --name brewlite-api -p 3001:3001 --env-file /opt/brewlite/.env "$ECR_REGISTRY/brewlite2:$IMAGE_TAG"

  smoke-test:
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Health check (API)
        run: |
          for i in {1..10}; do
            curl -fsS http://${{ secrets.EC2_HOST }}:3001/health && exit 0
            sleep 5
          done
          echo "API smoke test failed"
          exit 1

  rollback:
    needs: [deploy, smoke-test]
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Roll back to previous images
        uses: appleboy/ssh-action@v1
        env:
          ECR_PASSWORD: ${{ needs.docker-image-api.outputs.ecr-password }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,ECR_REGISTRY
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker stop brewlite-api || true
            docker rm brewlite-api || true
            docker run -d --name brewlite-api -p 3001:3001 --env-file /opt/brewlite/.env "$ECR_REGISTRY/brewlite2:latest"