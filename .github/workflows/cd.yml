name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-and-push-image:
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      ecr-password: ${{ steps.ecr-password.outputs.password }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: brewlite
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./apps/api
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      - name: Get ECR login password
        id: ecr-password
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    env:
      ECR_PASSWORD: ${{ needs.build-and-push-image.outputs.ecr-password }}
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        env:
          ECR_PASSWORD: ${{ needs.build-and-push-image.outputs.ecr-password }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,ECR_REGISTRY,IMAGE_TAG
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/brewlite:$IMAGE_TAG"
            docker stop brewlite-api || true
            docker rm brewlite-api || true
            docker run -d --name brewlite-api -p 3001:3001 --env-file /opt/brewlite/.env "$ECR_REGISTRY/brewlite:$IMAGE_TAG"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          for i in {1..10}; do
            curl -fsS http://${{ secrets.EC2_HOST }}:3001/health && exit 0
            sleep 5
          done
          echo "Smoke test failed"
          exit 1

  rollback:
    needs: smoke-test
    if: failure()
    runs-on: ubuntu-latest
    env:
      ECR_PASSWORD: ${{ needs.build-and-push-image.outputs.ecr-password }}
    steps:
      - name: Roll back to previous image
        uses: appleboy/ssh-action@v1
        env:
          ECR_PASSWORD: ${{ needs.build-and-push-image.outputs.ecr-password }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,ECR_REGISTRY
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker stop brewlite-api || true
            docker rm brewlite-api || true
            docker run -d --name brewlite-api -p 3001:3001 --env-file /opt/brewlite/.env "$ECR_REGISTRY/brewlite:latest"