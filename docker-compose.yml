version: '3.9'

services:
  web:
    build:
      context: ./apps/web
    container_name: brewlite-web
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - brewlite-network

  api:
    build:
      context: ./apps/api
    container_name: brewlite-api
    env_file:
      - .env
    environment:
      PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://brewlite:brewlite@db:5432/brewlite}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brewlite-network

  db:
    image: postgres:16-alpine
    container_name: brewlite-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite} -d ${POSTGRES_DB:-brewlite}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brewlite-network

networks:
  brewlite-network:
    driver: bridge

volumes:
  postgres_data:
