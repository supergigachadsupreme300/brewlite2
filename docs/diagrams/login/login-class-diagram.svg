<text x="37" y="399" font-size="12">Cả hai DTO được validate bằng class-validator</text>
<text x="37" y="414" font-size="12">(FR-02): email đúng định dạng; mật khẩu đăng ký</text>
<text x="37" y="429" font-size="12">tối thiểu 8 ký tự.</text>
<line x1="150" y1="322" x2="150" y2="382" stroke="#181818" stroke-width="1" stroke-dasharray="7 7"/>
