<path d="M890,382 L890,392 L900,392" fill="#FFFFE0" stroke="#B8860B" stroke-width="0.8"/>
<text x="407" y="399" font-size="12">passwordHash: chỉ lưu hash bcrypt ($2b$, salt rounds 10-12), không bao giờ</text>
<text x="407" y="414" font-size="12">lưu, ghi log hoặc trả về mật khẩu thô hay hash (FR-04, NFR-01).</text>
<text x="407" y="429" font-size="12">email: định danh duy nhất, UNIQUE (FR-02).</text>
<text x="407" y="444" font-size="12">Không có role: RBAC thuộc Won't Have trong MVP.</text>
