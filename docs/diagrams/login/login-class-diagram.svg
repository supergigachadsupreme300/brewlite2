<text x="927" y="399" font-size="12">Access token có thời hạn (mặc</text>
<text x="927" y="414" font-size="12">định 1 giờ), ký bằng JWT_SECRET</text>
<text x="927" y="429" font-size="12">lấy từ biến môi trường</text>
<text x="927" y="444" font-size="12">(FR-05, NFR-02). sub = User.id.</text>
<line x1="1015" y1="192" x2="1015" y2="382" stroke="#181818" stroke-width="1" stroke-dasharray="7 7"/>
